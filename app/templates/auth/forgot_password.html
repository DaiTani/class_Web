{% extends "base.html" %}
{% block title %}忘记密码 - 班级网站{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-md">
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="p-6 sm:p-8">
            <h1 class="text-3xl font-bold mb-6 text-gray-900">忘记密码</h1>
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="flash-messages mb-4 p-3 bg-red-100 rounded text-red-700">
                        {% for message in messages %}
                            <p>{{ message }}</p>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}
            <form method="POST" action="/auth/forgot_password">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-4">
                    <label for="student_id" class="block mb-2 text-sm font-medium text-gray-700">学号</label>
                    <input type="text" id="student_id" name="student_id" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200">
                </div>
                <div class="mb-6">
                    <label for="id_card" class="block mb-2 text-sm font-medium text-gray-700">身份证号</label>
                    <input type="text" id="id_card" name="id_card" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white py-2 px-4 rounded-lg hover:from-indigo-600 hover:to-purple-700 transition duration-300 transform hover:scale-[1.02] shadow-md hover:shadow-lg">验证身份</button>
            </form>
            <p class="mt-4 text-center text-gray-600">返回登录？<a href="/auth/login" class="text-indigo-600 hover:text-indigo-800 font-medium">立即登录</a></p>
        </div>
    </div>
</div>
{% endblock %}
