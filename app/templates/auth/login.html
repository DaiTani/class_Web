{% extends "base.html" %}
{% block title %}用户登录{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-md">
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="p-6 sm:p-8">
            <h1 class="text-3xl font-bold mb-6 text-gray-900">用户登录</h1>
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="flash-messages mb-4 p-3 bg-red-100 rounded text-red-700">
                        {% for message in messages %}
                            <p>{{ message }}</p>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}
            <form method="POST" action="/auth/login">
                <!-- 添加CSRF令牌字段 -->
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-4">
                    <label for="email" class="block mb-2 text-sm font-medium text-gray-700">邮箱</label>
                    <input type="email" id="email" name="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200">
                </div>
                <div class="mb-6">
                    <label for="password" class="block mb-2 text-sm font-medium text-gray-700">密码</label>
                    <input type="password" id="password" name="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white py-2 px-4 rounded-lg hover:from-indigo-600 hover:to-purple-700 transition duration-300 transform hover:scale-[1.02] shadow-md hover:shadow-lg">登录</button>
            </form>
            <p class="mt-4 text-center text-gray-600">还没有账号？<a href="/auth/register" class="text-indigo-600 hover:text-indigo-800 font-medium">立即注册</a></p>
        </div>
    </div>
</div>
{% endblock %}
</body>
</html>
